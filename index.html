<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대전 사역 & 시스템 네트워크 지도</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (for beautiful icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
        }
        .tab-active {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <!-- Header Banner -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white py-10 px-4 shadow-md">
        <div class="max-w-6xl mx-auto text-center">
            <span class="bg-blue-500/30 text-blue-200 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider mb-3 inline-block">Daejeon Ministry Network</span>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">대전 사역 & 시스템 팀 현황</h1>
            <p class="mt-2 text-blue-200 text-sm md:text-base max-w-2xl mx-auto">
                대전 지역에서 활동 중인 예배 사역팀, 침신대 학내 팀, 음향·조명·영상 시스템팀
            </p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 mt-8">
        
        <!-- Search & Quick Stats -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <!-- Search Input -->
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterTeams()" placeholder="팀명, 인물, 출신 학교, 키워드를 검색하세요..." 
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-sm">
                </div>
                
                <!-- Stats Showcase -->
                <div class="flex gap-4 text-center justify-around md:justify-end text-sm">
                    <div class="bg-blue-50 px-4 py-2 rounded-xl">
                        <span class="block text-xs text-gray-500 font-medium">예배 & 사역</span>
                        <span class="text-lg font-bold text-blue-600" id="countWorship">14</span>
                    </div>
                    <div class="bg-emerald-50 px-4 py-2 rounded-xl">
                        <span class="block text-xs text-gray-500 font-medium">캠퍼스 팀</span>
                        <span class="text-lg font-bold text-emerald-600" id="countCampus">5</span>
                    </div>
                    <div class="bg-orange-50 px-4 py-2 rounded-xl">
                        <span class="block text-xs text-gray-500 font-medium">시스템 & 전문</span>
                        <span class="text-lg font-bold text-orange-600" id="countTech">10</span>
                    </div>
                </div>
            </div>

            <!-- Category Filter Tabs -->
            <div class="flex flex-wrap gap-2 mt-6 border-t border-gray-100 pt-4" id="tabContainer">
                <button onclick="setCategory('all')" class="category-tab px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow-sm transition-all">전체보기</button>
                <button onclick="setCategory('worship')" class="category-tab px-4 py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">예배 및 사역팀</button>
                <button onclick="setCategory('campus')" class="category-tab px-4 py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">침신대 학내팀</button>
                <button onclick="setCategory('tech')" class="category-tab px-4 py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">시스템 & 엔지니어</button>
                <button onclick="setCategory('artist')" class="category-tab px-4 py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">아티스트 & 밴드</button>
            </div>
        </div>

        <!-- Grid Results -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cardsGrid">
            <!-- Dynamic Cards go here -->
        </div>

        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm">
            <i data-lucide="folder-open" class="w-12 h-12 text-gray-300 mx-auto mb-3"></i>
            <p class="text-gray-500 font-medium">검색 결과와 일치하는 사역팀 정보가 없습니다.</p>
        </div>
    </main>

            { name: "침신대 정오기도회", category: "campus", categoryLabel: "침례신학대 (학부)", tags: ["학부 팀", "기도 예배"], details: [{ label: "소속", value: "침례신학대학교 학부" }], description: "낮 12시마다 예배와 기도의 불을 지피는 순수 학내 자생 기도팀입니다." },

            { name: "향기스토리", category: "tech", categoryLabel: "문화 사역/시스템", tags: ["대전 로컬"], description: "기독교 문화 사역을 선도합니다." },
            { name: "재즈 밴드 '폴리 (Polly)'", category: "artist", categoryLabel: "전문 연주 단체", tags: ["재즈 엣지", "신앙인"], details: [{ label: "대표", value: "이기명 전도사" }], description: "기술과 감각 면에서 단연 독보적인 전문 프로 재즈 연주 밴드입니다." }
        ];

        let activeCategory = 'all';

        function init() {
            renderCards();
            updateStats();
            lucide.createIcons();
        }

        function setCategory(category) {
            activeCategory = category;
            const tabs = document.querySelectorAll('.category-tab');
            tabs.forEach(tab => {
                tab.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                tab.classList.add('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
            });
            event.target.classList.remove('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
            event.target.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
            filterTeams();
        }

        function filterTeams() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = data.filter(item => {
                const matchesCategory = (activeCategory === 'all' || item.category === activeCategory);
                const searchString = [
                    item.name,
                    item.categoryLabel,
                    ...(item.tags || []),
                    item.description || "",
                    ...(item.details ? item.details.map(d => d.value) : [])
                ].join(' ').toLowerCase();
                const matchesQuery = searchString.includes(query);
                return matchesCategory && matchesQuery;
            });
            renderCards(filtered);
        }

        function renderCards(list = data) {
            const grid = document.getElementById('cardsGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            noResults.classList.add('hidden');

            list.forEach(item => {
                let badgeColor = "bg-blue-50 text-blue-700";
                if (item.category === 'campus') badgeColor = "bg-emerald-50 text-emerald-700";
                if (item.category === 'tech') badgeColor = "bg-orange-50 text-orange-700";
                if (item.category === 'artist') badgeColor = "bg-purple-50 text-purple-700";

                let detailsHtml = "";
                if (item.details && item.details.length > 0) {
                    detailsHtml = `
                        <div class="mt-4 pt-4 border-t border-gray-100 space-y-1.5 text-xs">
                            ${item.details.map(d => `
                                <div class="flex justify-between">
                                    <span class="text-gray-400 font-medium">${d.label}</span>
                                    <span class="text-gray-700 font-semibold text-right max-w-[180px] truncate" title="${d.value}">${d.value}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                const tagsHtml = item.tags ? item.tags.map(tag => `
                    <span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-md font-medium">#${tag}</span>
                `).join('') : '';

                const cardHtml = `
                    <div class="bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 p-6 border border-gray-100 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${badgeColor}">${item.categoryLabel}</span>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800 mb-1 hover:text-blue-600 transition-colors">${item.name}</h3>
                            <p class="text-xs text-gray-500 line-clamp-3 leading-relaxed mt-2">
                                ${item.description || "상세 사역 정보 준비 중입니다."}
                            </p>
                            <div class="flex flex-wrap gap-1 mt-3">
                                ${tagsHtml}
                            </div>
                        </div>
                        ${detailsHtml}
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function updateStats() {
            const worship = data.filter(i => i.category === 'worship').length;
            const campus = data.filter(i => i.category === 'campus').length;
            const tech = data.filter(i => i.category === 'tech' || i.category === 'artist').length;
            document.getElementById('countWorship').innerText = worship;
            document.getElementById('countCampus').innerText = campus;
            document.getElementById('countTech').innerText = tech;
        }

        window.onload = init;
    </script>
</body>
</html>
